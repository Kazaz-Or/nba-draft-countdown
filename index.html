<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA Draft Countdown 🏀</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="basketball-bg"></div>

    <div class="container">
      <header>
        <div class="logo">
          <span class="basketball">🏀</span>
          <h1>NBA DRAFT COUNTDOWN</h1>
          <span class="basketball">🏀</span>
        </div>
        <p class="subtitle">Fantasy League Draft Time!</p>
      </header>

      <div class="countdown-container">
        <div class="countdown" id="countdown">
          <div class="time-block">
            <span class="number" id="days">00</span>
            <span class="label">DAYS</span>
          </div>
          <div class="time-block">
            <span class="number" id="hours">00</span>
            <span class="label">HOURS</span>
          </div>
          <div class="time-block">
            <span class="number" id="minutes">00</span>
            <span class="label">MINUTES</span>
          </div>
          <div class="time-block">
            <span class="number" id="seconds">00</span>
            <span class="label">SECONDS</span>
          </div>
        </div>
      </div>

      <div class="draft-info">
        <h2>📅 October 17, 2025 | 22:00 Israel Time</h2>
        <p class="fun-quote" id="quote">
          Ready to draft your championship team? 🏆
        </p>
      </div>

      <div class="basketball-court">
        <div class="court-line"></div>
        <div class="bouncing-ball" id="ball">🏀</div>
      </div>
    </div>

    <footer>
      <p>Good luck with your draft! 🍀</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
